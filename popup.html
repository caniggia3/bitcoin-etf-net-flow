<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitcoin ETF Net Flow</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <img class="logo" src="icons/icon48.png" alt="Bitcoin ETF Net Flow" />
        <div class="header-text">
          <h1>Bitcoin ETF Net Flow</h1>
          <span id="flow-date" class="flow-date">Loading...</span>
        </div>
      </div>
      <button id="refresh-btn" class="refresh-btn" title="Refresh">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/>
          <path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
          <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
        </svg>
      </button>
    </header>

    <!-- Main Value -->
    <section class="value-section">
      <span id="flow-value" class="flow-value">---.--</span>
      <span id="flow-percent" class="flow-percent"></span>
    </section>

    <!-- Historical Values -->
    <section class="history-section">
      <div class="history-item">
        <span class="history-label">Last Week</span>
        <span id="last-week" class="history-value">---</span>
      </div>
      <div class="history-item">
        <span class="history-label">Last Month</span>
        <span id="last-month" class="history-value">---</span>
      </div>
      <div class="history-item">
        <span class="history-label">Last 3 Months</span>
        <span id="last-3-months" class="history-value">---</span>
      </div>
    </section>

    <!-- Chart -->
    <section class="chart-section">
      <div class="chart-header">
        <h2>Net Flow Chart</h2>
        <div class="timeframe-tabs">
          <button class="tab active" data-range="30d">30d</button>
          <button class="tab" data-range="1y">1y</button>
          <button class="tab" data-range="all">All</button>
        </div>
      </div>
      <div class="chart-wrapper">
        <canvas id="flow-chart"></canvas>
      </div>
      <div class="chart-footer">
        <span id="chart-total" class="chart-total">Total: ---</span>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span id="last-updated" class="last-updated">Last updated: ---</span>
      <a href="https://coinmarketcap.com/etf/bitcoin/" target="_blank" class="source-link">View on CoinMarketCap &#8599;</a>
    </footer>
  </div>

  <script src="lib/chart.umd.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
